name: CI

# main への Pull Request と、chore/ で始まるブランチへの push で実行する
on:
  pull_request:
    branches: [main]
  push:
    branches: ['chore/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: 依存パッケージをインストール
        run: yarn install --frozen-lockfile

      - name: ビルドとテストを実行
        timeout-minutes: 10
        run: yarn test
